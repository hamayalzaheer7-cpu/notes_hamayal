<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <p class="tag">MY NOTES</p>
        <h1>Hamayal Notes!</h1>
        <p class="subtitle">“Simple notes,Smarter organization.”</p>
    </header>

    <main>
        <section class="write">
            <h2>Write your note</h2>

            <textarea id="note" placeholder="What's on your mind today?"></textarea>

            <button onclick="saveNote()">Save note +</button>
        </section>

        <section class="saved">

            <div id="notes"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
